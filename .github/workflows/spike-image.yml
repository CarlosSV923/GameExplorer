name: Spike image (phase 0.5)

# Publishes the throwaway large-file spike so it can be installed on TrueNAS
# as a Custom App. Delete this workflow together with spikes/ after phase 0.5.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - spikes/large-files/**
      - .github/workflows/spike-image.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: spikes/large-files
          platforms: linux/amd64
          push: true
          tags: ghcr.io/carlossv923/gameexplorer-spike:latest
          labels: |
            org.opencontainers.image.source=https://github.com/CarlosSV923/GameExplorer
            org.opencontainers.image.description=Throwaway large-file spike for GameExplorer (phase 0.5)
