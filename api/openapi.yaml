openapi: 3.0.3
info:
  title: GameExplorer API
  version: 0.1.0
  description: |
    Single source of truth for the GameExplorer HTTP contract.
    Go handlers (oapi-codegen strict server) and the TypeScript client
    (openapi-typescript) are generated from this file; never edit generated code.

    Uploads are NOT described here: they use the tus resumable upload protocol
    (https://tus.io/protocols/resumable-upload) mounted at /api/uploads/.

    Every operation requires the session cookie unless it declares `security: []`.
  license:
    name: MIT
servers:
  - url: /api
tags:
  - name: system
  - name: auth
  - name: consoles
  - name: metadata
  - name: uploads
  - name: library
  - name: trash
security:
  - sessionCookie: []
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe and startup diagnostics
      description: |
        Always answers 200 while the process is up. `status` is `degraded` when
        a check fails (for example the library is not writable), so the UI can
        explain the problem instead of the container crash-looping.
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Start a session with the shared password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Session started; the cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session on this device
      security: []
      responses:
        '204':
          description: Session cookie cleared.
          headers:
            Set-Cookie:
              schema:
                type: string

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session
      responses:
        '200':
          description: The session is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /consoles:
    get:
      tags: [consoles]
      operationId: listConsoles
      summary: Consoles in carousel order
      responses:
        '200':
          description: All consoles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Console'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [consoles]
      operationId: createConsole
      summary: Add a console for an IGDB platform; it goes last (RF-41)
      description: Consoles added by the user are detected by extension only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsoleCreate'
      responses:
        '201':
          description: The new console.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Console'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /consoles/order:
    put:
      tags: [consoles]
      operationId: reorderConsoles
      summary: Set the carousel order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsoleOrder'
      responses:
        '200':
          description: Consoles in the new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Console'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /consoles/{id}:
    patch:
      tags: [consoles]
      operationId: updateConsole
      summary: Change a console's name, extensions or (without games) its folder
      parameters:
        - $ref: '#/components/parameters/ConsoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsoleInput'
      responses:
        '200':
          description: The console.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Console'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [consoles]
      operationId: deleteConsole
      summary: Delete a console added by the user that has no games
      parameters:
        - $ref: '#/components/parameters/ConsoleId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /metadata/games:
    get:
      tags: [metadata]
      operationId: searchGames
      summary: Search games on IGDB, optionally limited to one platform
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: platformId
          in: query
          description: IGDB platform id (Console.igdbPlatformId).
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
      responses:
        '200':
          description: Matching games, best match first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetadataGame'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /metadata/platforms:
    get:
      tags: [metadata]
      operationId: searchPlatforms
      summary: Search platforms on IGDB (used to add consoles)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        '200':
          description: Matching platforms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetadataPlatform'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /jobs:
    get:
      tags: [uploads]
      operationId: listJobs
      summary: Recent upload jobs, newest first
      description: |
        A job is created when the browser starts a tus upload at /api/uploads/
        (metadata `filename`, optional `consoleSlug`) and follows the file
        through extraction, review and commit.
      responses:
        '200':
          description: Up to 100 jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UploadJob'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobs/events:
    get:
      tags: [uploads]
      operationId: streamJobEvents
      summary: Live job changes (server-sent events)
      description: |
        `text/event-stream`. Each change is sent as `event: job` with an
        UploadJob JSON in `data`. On connect the server first replays every
        non-terminal job, then streams changes; a comment line is sent every
        25 seconds to keep proxies from closing the connection.
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobs/{id}:
    get:
      tags: [uploads]
      operationId: getJob
      summary: One upload job
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /jobs/{id}/items:
    get:
      tags: [uploads]
      operationId: listJobItems
      summary: Items found in an upload, with console and kind suggestions
      description: |
        Available once the job reaches `review`. Ignored items (readme, .nfo…)
        are listed so the review can show what was set aside.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Items, sorted by path.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StagedItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /jobs/{id}/password:
    post:
      tags: [uploads]
      operationId: submitJobPassword
      summary: Retry extraction of an encrypted archive with its password
      description: The password is used for this extraction only and never stored.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
      responses:
        '202':
          description: Extraction queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /jobs/{id}/cancel:
    post:
      tags: [uploads]
      operationId: cancelJob
      summary: Cancel a job and delete its uploaded data
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The cancelled job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /jobs/{id}/plan:
    post:
      tags: [uploads]
      operationId: planJobCommit
      summary: Preview where a reviewed upload would be stored
      description: |
        Computes the final folder and file names (spec §5) and the duplicates
        against the game's current items (RF-10), without changing anything.
        `onDuplicate` may be left out; such items come back as `undecided`.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /jobs/{id}/commit:
    post:
      tags: [uploads]
      operationId: commitJob
      summary: Store a reviewed upload in the library
      description: |
        Moves the items to `<console>/<game>/` with their final names, rewrites
        the FILE lines of .cue sheets, sends replaced duplicates to the trash and
        deletes the staging area (RF-11). Every duplicate needs `onDuplicate`.
        If anything fails, every move is undone and the job returns to review
        with the reason in `error`.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: Stored; the job is done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /consoles/{slug}/games:
    get:
      tags: [library]
      operationId: listConsoleGames
      summary: Games of one console, by title
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
      responses:
        '200':
          description: Games with at least one item in the library (trashed items do not count).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /games:
    get:
      tags: [library]
      operationId: searchLibrary
      summary: Search the library by title, across consoles (RF-22)
      description: Every word must appear in the title; case and accents are ignored.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Matching games, by title.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /games/{id}:
    get:
      tags: [library]
      operationId: getGame
      summary: Game detail with its items (RF-21)
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: The game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /games/{id}/download:
    get:
      tags: [library]
      operationId: downloadGame
      summary: The whole game as an uncompressed zip, streamed (RF-23)
      description: |
        Entries are "<game folder>/<file>". The zip is built while it is sent,
        so it cannot be resumed; Content-Length is announced, and files over
        4 GB use zip64.
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: The zip.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /items/{id}/download:
    get:
      tags: [library]
      operationId: downloadItem
      summary: Download one item (RF-23)
      description: |
        A single-file item is sent as is and supports HTTP Range (resumable
        downloads). Discs (.cue + tracks) and folder games are sent as a zip,
        like /games/{id}/download.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: The file, or a zip for multi-file items.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        '206':
          description: The requested range of a single-file item.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: The requested range is not satisfiable.

  /games/{id}/trash:
    post:
      tags: [trash]
      operationId: trashGame
      summary: Send every item of a game to the trash, as one entry (RF-25)
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '204':
          description: In the trash.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /items/{id}/trash:
    post:
      tags: [trash]
      operationId: trashItem
      summary: Send one item to the trash (RF-25)
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204':
          description: In the trash.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /items/{id}/forget:
    post:
      tags: [library]
      operationId: forgetItem
      summary: Remove a missing item (deleted over SMB) from the library (RF-26)
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204':
          description: Forgotten.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /library/check:
    post:
      tags: [library]
      operationId: checkLibrary
      summary: Run the integrity check now (it also runs every hour)
      responses:
        '200':
          description: What changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityReport'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /games/{id}/rematch/plan:
    post:
      tags: [library]
      operationId: planRematch
      summary: Preview matching a game to another IGDB entry (RF-24)
      description: |
        When the new IGDB game is already in the library (same console) the
        games merge; items that are duplicates there come back `undecided`.
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RematchRequest'
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RematchPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /games/{id}/rematch:
    post:
      tags: [library]
      operationId: rematchGame
      summary: Match a game to another IGDB entry, renaming its folder and files (RF-24)
      description: Reversible like a commit. Every duplicate of a merge needs a decision.
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RematchRequest'
      responses:
        '200':
          description: Where the game is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RematchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /trash:
    get:
      tags: [trash]
      operationId: listTrash
      summary: The trash, newest first (RF-30)
      responses:
        '200':
          description: Entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrashEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [trash]
      operationId: emptyTrash
      summary: Delete everything in the trash for good
      responses:
        '204':
          description: Emptied.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /trash/{id}:
    delete:
      tags: [trash]
      operationId: deleteTrashEntry
      summary: Delete one entry for good
      parameters:
        - $ref: '#/components/parameters/TrashEntryId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /trash/{id}/restore:
    post:
      tags: [trash]
      operationId: restoreTrashEntry
      summary: Put an entry back in its game
      description: |
        Files take the names of the game's current title. If an item's place
        is taken (a duplicate was stored since), the answer is 409 unless
        `onConflict` is `replace`: the current item then goes to the trash.
      parameters:
        - $ref: '#/components/parameters/TrashEntryId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /images/{size}/{imageId}:
    get:
      tags: [metadata]
      operationId: getImage
      summary: IGDB image (cover or logo) served from the local cache
      description: |
        Downloaded from the IGDB image CDN on first request and cached under
        DATA_PATH, so the NAS keeps working offline and the browser never
        contacts third parties.
      parameters:
        - name: size
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ImageSize'
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]{1,40}$'
      responses:
        '200':
          description: The image.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ge_session

  parameters:
    ConsoleId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ItemId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TrashEntryId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    GameId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]{1,64}$'

  responses:
    Conflict:
      description: The resource is in a state that does not allow this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid or expired session, or wrong password.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many login attempts from this client; retry later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Invalid parameters.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: IGDB failed or could not be reached.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: The operation failed; `detail` explains what happened.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: IGDB credentials are not configured.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheck'

    HealthCheck:
      type: object
      required: [name, ok]
      properties:
        name:
          type: string
          example: library-writable
        ok:
          type: boolean
        message:
          type: string
          description: Human readable explanation when the check fails.

    LoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          format: password

    Session:
      type: object
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time

    Console:
      type: object
      required: [id, slug, displayName, extensions, sortOrder, gameCount]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
          description: Folder name in the library (ES-DE style).
          example: ps2
        displayName:
          type: string
          example: PlayStation 2
        igdbPlatformId:
          type: integer
          format: int64
          nullable: true
        releaseYear:
          type: integer
          nullable: true
          example: 2000
        logoImageId:
          type: string
          nullable: true
          description: IGDB image id; render with /api/images/logo_med/{logoImageId}.
        extensions:
          type: array
          items:
            type: string
            example: .iso
        sortOrder:
          type: integer
        gameCount:
          type: integer
          description: Games with at least one item in the library.

    MetadataGame:
      type: object
      required: [id, name, genres, platformIds]
      properties:
        id:
          type: integer
          format: int64
          description: IGDB game id.
        name:
          type: string
          example: Mario Kart 8 Deluxe
        releaseYear:
          type: integer
          nullable: true
        coverImageId:
          type: string
          nullable: true
          description: Render with /api/images/cover_big/{coverImageId}.
        summary:
          type: string
          nullable: true
        genres:
          type: array
          items:
            type: string
        platformIds:
          type: array
          items:
            type: integer
            format: int64

    MetadataPlatform:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          description: IGDB platform id.
        name:
          type: string
          example: Wii U
        abbreviation:
          type: string
          nullable: true
        logoImageId:
          type: string
          nullable: true
        releaseYear:
          type: integer
          nullable: true

    ImageSize:
      type: string
      description: IGDB image size preset.
      enum: [cover_small, cover_big, logo_med, screenshot_med]

    JobStatus:
      type: string
      description: |
        uploading → uploaded → (extracting ⇄ needs_password) → review →
        committing → done; failed, cancelled and merged are terminal.
        Parts of a multi-volume archive go uploaded → waiting_parts; when the
        set is complete the first volume continues and the rest become merged.
      enum:
        [
          uploading,
          uploaded,
          waiting_parts,
          merged,
          extracting,
          needs_password,
          review,
          committing,
          done,
          failed,
          cancelled,
        ]

    UploadJob:
      type: object
      required: [id, fileName, size, received, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Equals the tus upload id.
        fileName:
          type: string
          example: INSIDE-Switch-NSP-Base-Game.rar
        size:
          type: integer
          format: int64
        received:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/JobStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Extraction percentage while status is extracting.
        error:
          type: string
          nullable: true
          description: Human readable reason (failed, or why a password is needed).
        warning:
          type: string
          nullable: true
          description: Non-fatal note, e.g. archive file attributes not applied.
        originConsole:
          type: string
          nullable: true
          description: Slug of the console screen the upload started from.
        volumeIndex:
          type: integer
          nullable: true
          description: Part number for multi-volume archives (1 = first).
        mergedInto:
          type: string
          nullable: true
          description: Job (first volume) that took over this part.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          format: password

    StagedItem:
      type: object
      required: [path, shape, parts, size, ignored, consoles, confidence]
      properties:
        path:
          type: string
          description: Relative to the upload; for discs, the .cue sheet. Identifies the item in the review.
          example: Wrapper/INSIDE [0100D2D009028000][v0].nsp
        shape:
          type: string
          enum: [file, disc, folder]
          description: file; disc = .cue plus its .bin tracks; folder = folder-format game (PS3), kept whole.
        parts:
          type: array
          items:
            type: string
        size:
          type: integer
          format: int64
        ignored:
          type: boolean
          description: Junk (readme, .nfo, images) set aside; not stored in the library.
        consoles:
          type: array
          description: Candidate console slugs; one when the content was conclusive, empty when unknown.
          items:
            type: string
        confidence:
          type: string
          enum: [header, extension, none]
        suggestedKind:
          allOf:
            - $ref: '#/components/schemas/ItemKind'
          nullable: true
        titleId:
          type: string
          nullable: true
          description: Nintendo Switch title id found in the file name.
        versionCode:
          type: string
          nullable: true
          description: Numeric version tag ([v196608]).
        displayVersion:
          type: string
          nullable: true
          description: Human version (1.0.3), suggested as the update label.
        discNumber:
          type: integer
          nullable: true

    ItemKind:
      type: string
      description: What a stored item is within a game folder.
      enum: [base, update, dlc, disc]

    CommitRequest:
      type: object
      required: [console, igdbGameId, items]
      properties:
        console:
          type: string
          description: Console slug.
          example: switch
        igdbGameId:
          type: integer
          format: int64
        items:
          type: array
          description: One entry per staged item that is not ignored.
          items:
            $ref: '#/components/schemas/CommitItem'

    CommitItem:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: StagedItem.path.
        skip:
          type: boolean
          description: Leave this item out of the library (it is deleted with the staging area).
        kind:
          $ref: '#/components/schemas/ItemKind'
        label:
          type: string
          description: Update version (v1.0.3) or DLC name.
        discNumber:
          type: integer
          minimum: 1
          maximum: 99
        onDuplicate:
          type: string
          enum: [replace, skip]
          description: replace sends the existing item to the trash; skip keeps it and drops this one.

    LibraryItem:
      type: object
      required: [id, kind, shape, files, size, createdAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/ItemKind'
        label:
          type: string
          nullable: true
        discNumber:
          type: integer
          nullable: true
        shape:
          type: string
          enum: [file, disc, folder]
          description: file downloads as is (resumable); disc and folder download as a zip.
        files:
          type: array
          description: Relative to the game folder; the first is the main entry.
          items:
            type: string
        size:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        missingSince:
          type: string
          format: date-time
          nullable: true
          description: Set while a file of the item is missing from disk (deleted over SMB).

    GameSummary:
      type: object
      required: [id, console, title, folder, itemCount, missingCount, size]
      properties:
        id:
          type: integer
          format: int64
        console:
          type: string
          description: Console slug.
        title:
          type: string
        folder:
          type: string
          description: Folder inside the console folder.
        releaseYear:
          type: integer
          nullable: true
        coverImageId:
          type: string
          nullable: true
          description: Render with /api/images/cover_big/{coverImageId}.
        itemCount:
          type: integer
        missingCount:
          type: integer
          description: Items with files missing from disk.
        size:
          type: integer
          format: int64
          description: Bytes of every item in the library.

    GameDetail:
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required: [igdbId, path, genres, items]
          properties:
            igdbId:
              type: integer
              format: int64
            path:
              type: string
              description: Library-relative folder.
              example: switch/Inside
            summary:
              type: string
              nullable: true
            genres:
              type: array
              items:
                type: string
            items:
              type: array
              description: Items in the library (not in the trash), base first.
              items:
                $ref: '#/components/schemas/LibraryItem'

    ConsoleInput:
      type: object
      required: [slug, displayName, extensions]
      properties:
        slug:
          type: string
          description: Folder name; can only change while the console has no games.
          example: n64
        displayName:
          type: string
          example: Nintendo 64
        extensions:
          type: array
          items:
            type: string
            example: .z64

    ConsoleCreate:
      allOf:
        - $ref: '#/components/schemas/ConsoleInput'
        - type: object
          required: [igdbPlatformId]
          properties:
            igdbPlatformId:
              type: integer
              format: int64

    ConsoleOrder:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          description: Every console id, first to last.
          items:
            type: integer
            format: int64

    IntegrityReport:
      type: object
      required: [checked, missing, found]
      properties:
        checked:
          type: integer
        missing:
          type: integer
          description: Items found missing in this check.
        found:
          type: integer
          description: Missing items whose files are back.

    RematchRequest:
      type: object
      required: [igdbGameId]
      properties:
        igdbGameId:
          type: integer
          format: int64
        decisions:
          type: array
          description: For duplicates when merging into a game that already has the new IGDB id.
          items:
            $ref: '#/components/schemas/ItemDecision'

    ItemDecision:
      type: object
      required: [itemId, onDuplicate]
      properties:
        itemId:
          type: integer
          format: int64
        onDuplicate:
          type: string
          enum: [replace, skip]
          description: replace sends the other game's item to the trash; skip sends this one.

    RematchPlan:
      type: object
      required: [console, title, folder, items]
      properties:
        console:
          type: string
        title:
          type: string
        folder:
          type: string
          description: Folder after the re-match.
        mergeInto:
          type: integer
          format: int64
          nullable: true
          description: Game that already has the new IGDB id; the games merge.
        items:
          type: array
          items:
            $ref: '#/components/schemas/RematchItem'

    RematchItem:
      type: object
      required: [item, files, action]
      properties:
        item:
          $ref: '#/components/schemas/LibraryItem'
        files:
          type: array
          description: New names.
          items:
            type: string
        action:
          type: string
          enum: [store, replace, skip, undecided]
        duplicate:
          allOf:
            - $ref: '#/components/schemas/LibraryItem'
          nullable: true

    RematchResult:
      type: object
      required: [gameId, path, merged]
      properties:
        gameId:
          type: integer
          format: int64
        path:
          type: string
          example: switch/Inside
        merged:
          type: boolean

    TrashEntry:
      type: object
      required:
        [id, gameId, console, title, folder, wholeGame, reason, trashedAt, expiresAt, size, items]
      properties:
        id:
          type: integer
          format: int64
        gameId:
          type: integer
          format: int64
        console:
          type: string
        title:
          type: string
        folder:
          type: string
        wholeGame:
          type: boolean
        reason:
          type: string
          enum: [deleted, replaced]
          description: deleted by the user, or replaced by a duplicate.
        trashedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When it is deleted for good (TRASH_RETENTION_DAYS).
        size:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/LibraryItem'

    RestoreRequest:
      type: object
      properties:
        onConflict:
          type: string
          enum: [replace]

    RestoreResult:
      type: object
      required: [gameId, path]
      properties:
        gameId:
          type: integer
          format: int64
        path:
          type: string

    PlannedItem:
      type: object
      required: [path, files, action]
      properties:
        path:
          type: string
        files:
          type: array
          description: Final names inside the game folder (a .cue sheet first, then its tracks).
          items:
            type: string
        action:
          type: string
          enum: [store, replace, skip, undecided]
        duplicate:
          allOf:
            - $ref: '#/components/schemas/LibraryItem'
          nullable: true

    CommitPlan:
      type: object
      required: [console, title, folder, existing, items]
      properties:
        console:
          type: string
        title:
          type: string
          description: Game title used for the names.
        folder:
          type: string
          description: Game folder inside the console folder.
          example: The Legend of Zelda - Tears of the Kingdom
        gameId:
          type: integer
          format: int64
          nullable: true
          description: Set when the game is already in the library.
        existing:
          type: array
          description: The game's current items.
          items:
            $ref: '#/components/schemas/LibraryItem'
        items:
          type: array
          description: Items that are not skipped by the user.
          items:
            $ref: '#/components/schemas/PlannedItem'

    CommitResult:
      type: object
      required: [job, gameId, path, stored, replaced, skipped]
      properties:
        job:
          $ref: '#/components/schemas/UploadJob'
        gameId:
          type: integer
          format: int64
        path:
          type: string
          description: Library-relative game folder.
          example: switch/Mario Kart 8 Deluxe
        stored:
          type: integer
        replaced:
          type: integer
        skipped:
          type: integer

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
