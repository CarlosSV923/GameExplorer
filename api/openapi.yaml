openapi: 3.0.3
info:
  title: GameExplorer API
  version: 0.2.0
  description: |
    Single source of truth for the GameExplorer HTTP contract.
    Go handlers (oapi-codegen strict server) and the TypeScript client
    (openapi-typescript) are generated from this file; never edit generated code.

    Uploads are NOT described here: they use the tus resumable upload protocol
    (https://tus.io/protocols/resumable-upload) mounted at /api/uploads/.
    Upload-Metadata keys: `filename` and `consoleSlug` and `title` (required),
    `igdbId` (optional, the IGDB game the title was picked from), and for the
    parts of one multi-volume archive `group` (a client-made id shared by the
    parts) and `groupSize` (how many parts).

    Every operation requires the session cookie unless it declares `security: []`.
  license:
    name: MIT
servers:
  - url: /api
tags:
  - name: system
  - name: auth
  - name: consoles
  - name: metadata
  - name: uploads
  - name: library
  - name: unassigned
  - name: trash
security:
  - sessionCookie: []
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe and startup diagnostics
      description: |
        Always answers 200 while the process is up. `status` is `degraded` when
        a check fails (for example the library is not writable), so the UI can
        explain the problem instead of the container crash-looping.
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Start a session with the shared password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Session started; the cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session on this device
      security: []
      responses:
        '204':
          description: Session cookie cleared.
          headers:
            Set-Cookie:
              schema:
                type: string

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session
      responses:
        '200':
          description: The session is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /consoles:
    get:
      tags: [consoles]
      operationId: listConsoles
      summary: The consoles defined in code, in carousel order (RF-40)
      description: Every console, with or without games; the carousel hides the empty ones.
      responses:
        '200':
          description: All consoles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Console'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /consoles/order:
    put:
      tags: [consoles]
      operationId: reorderConsoles
      summary: Set the carousel order (RF-42)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsoleOrder'
      responses:
        '200':
          description: Consoles in the new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Console'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /consoles/{slug}:
    patch:
      tags: [consoles]
      operationId: updateConsole
      summary: Change a console's display name (RF-42)
      parameters:
        - $ref: '#/components/parameters/ConsoleSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsoleUpdate'
      responses:
        '200':
          description: The console.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Console'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /consoles/{slug}/extensions:
    post:
      tags: [consoles]
      operationId: addConsoleExtension
      summary: Add a custom extension to a console (RF-41)
      parameters:
        - $ref: '#/components/parameters/ConsoleSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionInput'
      responses:
        '200':
          description: The console.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Console'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [consoles]
      operationId: removeConsoleExtension
      summary: Remove a custom extension that no file uses (RF-41)
      parameters:
        - $ref: '#/components/parameters/ConsoleSlug'
        - name: extension
          in: query
          required: true
          schema:
            type: string
            example: .xcz
      responses:
        '200':
          description: The console.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Console'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /metadata/games:
    get:
      tags: [metadata]
      operationId: searchGames
      summary: Search games on IGDB, optionally limited to one platform
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: platformId
          in: query
          description: IGDB platform id (Console.igdbPlatformId).
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
      responses:
        '200':
          description: Matching games, best match first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetadataGame'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /metadata/status:
    get:
      tags: [metadata]
      operationId: getMetadataStatus
      summary: Whether IGDB is configured (RF-54)
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobs:
    get:
      tags: [uploads]
      operationId: listJobs
      summary: Recent upload jobs, newest first
      description: |
        A job is created when the browser starts a tus upload at /api/uploads/
        (see the metadata above) or assigns a file from the unassigned section,
        and follows it through extraction, validation, confirmation and commit.
      responses:
        '200':
          description: Up to 100 jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UploadJob'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobs/events:
    get:
      tags: [uploads]
      operationId: streamJobEvents
      summary: Live job changes (server-sent events)
      description: |
        `text/event-stream`. Each change is sent as `event: job` with an
        UploadJob JSON in `data`. On connect the server first replays every
        non-terminal job, then streams changes; a comment line is sent every
        25 seconds to keep proxies from closing the connection.
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobs/{id}:
    get:
      tags: [uploads]
      operationId: getJob
      summary: One upload job
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /jobs/{id}/files:
    get:
      tags: [uploads]
      operationId: listJobFiles
      summary: Files found in an upload (RF-07)
      description: |
        Available once the job reaches `confirm` or `invalid`. `valid` says
        whether the file is a game file for the job's console; the rest are
        discarded when the job is stored.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Files, sorted by path.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StagedFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /jobs/{id}/password:
    post:
      tags: [uploads]
      operationId: submitJobPassword
      summary: Retry extraction of an encrypted archive with its password
      description: The password is used for this extraction only and never stored.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
      responses:
        '202':
          description: Extraction queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /jobs/{id}/console:
    post:
      tags: [uploads]
      operationId: changeJobConsole
      summary: Validate the upload's files for another console (RF-07)
      description: |
        The files stay where they are (nothing is extracted again); the job
        becomes `confirm` if they fit the new console, `invalid` otherwise.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsoleChange'
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /jobs/{id}/resolve:
    post:
      tags: [uploads]
      operationId: resolveJob
      summary: Set aside an upload that does not fit its console (RF-07)
      description: |
        `unassigned` moves the extracted files to the unassigned section,
        `trash` sends them to the trash (restorable to the unassigned section)
        and `delete` deletes them for good.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /jobs/{id}/cancel:
    post:
      tags: [uploads]
      operationId: cancelJob
      summary: Cancel a job and delete its uploaded data
      description: A job assigned from the unassigned section gives its file back to the section.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The cancelled job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /jobs/{id}/plan:
    post:
      tags: [uploads]
      operationId: planJobCommit
      summary: Preview the final names of an upload ready to confirm (RF-08, RF-09)
      description: |
        Computes the game folder and file names (spec §5) and the duplicates
        against the game's current files, without changing anything.
        `onDuplicate` may be left out; such files come back as `undecided`.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /jobs/{id}/commit:
    post:
      tags: [uploads]
      operationId: commitJob
      summary: Store a confirmed upload in the library (RF-10)
      description: |
        Moves the valid files to `<console>/<game>/` with their final names,
        sends replaced duplicates to the trash and deletes the rest of the
        staging area. Every duplicate needs `onDuplicate`. If anything fails,
        every move is undone and the job returns to `confirm` with the reason
        in `error`.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: Stored; the job is done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /consoles/{slug}/games:
    get:
      tags: [library]
      operationId: listConsoleGames
      summary: Games of one console, by title
      parameters:
        - $ref: '#/components/parameters/ConsoleSlug'
      responses:
        '200':
          description: Games with at least one file in the library (trashed files do not count).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /games:
    get:
      tags: [library]
      operationId: searchLibrary
      summary: Search the library by title, across consoles (RF-22)
      description: Every word must appear in the title; case and accents are ignored.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Matching games, by title.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /games/{id}:
    get:
      tags: [library]
      operationId: getGame
      summary: Game detail with its files (RF-21)
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: The game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /games/{id}/edit/plan:
    post:
      tags: [library]
      operationId: planGameEdit
      summary: Preview renaming a game or moving it to another console (RF-24)
      description: |
        When another game of the target console already has the new name the
        games merge; files that would collide come back `undecided`. Moving
        needs every file's extension to be valid on the target console.
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameEdit'
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameEditPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /games/{id}/edit:
    post:
      tags: [library]
      operationId: editGame
      summary: Rename a game or move it to another console (RF-24)
      description: Reversible like a commit. Every collision of a merge needs a decision.
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameEdit'
      responses:
        '200':
          description: Where the game is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameEditResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /games/{id}/download:
    get:
      tags: [library]
      operationId: downloadGame
      summary: The whole game as an uncompressed zip, streamed (RF-23)
      description: |
        Entries are "<game folder>/<file>". The zip is built while it is sent,
        so it cannot be resumed; Content-Length is announced, and files over
        4 GB use zip64.
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: The zip.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /games/{id}/trash:
    post:
      tags: [trash]
      operationId: trashGame
      summary: Send every file of a game to the trash, as one entry (RF-25)
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '204':
          description: In the trash.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /games/{id}/unassign:
    post:
      tags: [unassigned]
      operationId: unassignGame
      summary: Move every file of a game to the unassigned section (RF-24)
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '204':
          description: Moved.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /items/{id}:
    patch:
      tags: [library]
      operationId: editItem
      summary: Change a file's kind, version or DLC name (RF-24)
      description: The file is renamed. A collision needs `onDuplicate`.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemEdit'
      responses:
        '200':
          description: The game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /items/{id}/download:
    get:
      tags: [library]
      operationId: downloadItem
      summary: Download one file; supports HTTP Range (RF-23)
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: The requested range.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: The requested range is not satisfiable.

  /items/{id}/trash:
    post:
      tags: [trash]
      operationId: trashItem
      summary: Send one file to the trash (RF-25)
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204':
          description: In the trash.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /items/{id}/unassign:
    post:
      tags: [unassigned]
      operationId: unassignItem
      summary: Move one file to the unassigned section (RF-24)
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204':
          description: Moved.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /unassigned:
    get:
      tags: [unassigned]
      operationId: listUnassigned
      summary: Files in the unassigned section, newest first (RF-27)
      responses:
        '200':
          description: Files.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnassignedFile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /unassigned/{id}:
    delete:
      tags: [unassigned]
      operationId: deleteUnassigned
      summary: Delete an unassigned file for good (RF-27)
      parameters:
        - $ref: '#/components/parameters/UnassignedId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /unassigned/{id}/download:
    get:
      tags: [unassigned]
      operationId: downloadUnassigned
      summary: Download an unassigned file; supports HTTP Range
      parameters:
        - $ref: '#/components/parameters/UnassignedId'
      responses:
        '200':
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: The requested range.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: The requested range is not satisfiable.

  /unassigned/{id}/trash:
    post:
      tags: [trash]
      operationId: trashUnassigned
      summary: Send an unassigned file to the trash (RF-27)
      parameters:
        - $ref: '#/components/parameters/UnassignedId'
      responses:
        '204':
          description: In the trash.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /unassigned/{id}/assign:
    post:
      tags: [unassigned]
      operationId: assignUnassigned
      summary: Start an upload job from an unassigned file (RF-27)
      description: |
        The file leaves the section and follows the upload pipeline
        (extraction if it is an archive, validation, confirmation). Cancelling
        the job gives it back to the section.
      parameters:
        - $ref: '#/components/parameters/UnassignedId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'
      responses:
        '201':
          description: The new job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /library/scan:
    get:
      tags: [library]
      operationId: getLibraryScan
      summary: The last library scan (RF-26)
      responses:
        '200':
          description: The last scan, if one has run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [library]
      operationId: scanLibrary
      summary: Scan the library for changes made over SMB now (RF-26)
      responses:
        '200':
          description: What changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanReport'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /trash:
    get:
      tags: [trash]
      operationId: listTrash
      summary: The trash, newest first (RF-30)
      responses:
        '200':
          description: Entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrashEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [trash]
      operationId: emptyTrash
      summary: Delete everything in the trash for good
      responses:
        '204':
          description: Emptied.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /trash/{id}:
    delete:
      tags: [trash]
      operationId: deleteTrashEntry
      summary: Delete one entry for good
      parameters:
        - $ref: '#/components/parameters/TrashEntryId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /trash/{id}/restore:
    post:
      tags: [trash]
      operationId: restoreTrashEntry
      summary: Put an entry back where it came from
      description: |
        Game files go back to their game, named for its current title; if a
        place is taken (a duplicate was stored since), the answer is 409 unless
        `onConflict` is `replace`: the current file then goes to the trash.
        Unassigned files go back to the unassigned section.
      parameters:
        - $ref: '#/components/parameters/TrashEntryId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /images/{size}/{imageId}:
    get:
      tags: [metadata]
      operationId: getImage
      summary: IGDB image (cover or logo) served from the local cache
      description: |
        Downloaded from the IGDB image CDN on first request and cached under
        DATA_PATH, so the NAS keeps working offline and the browser never
        contacts third parties.
      parameters:
        - name: size
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ImageSize'
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]{1,40}$'
      responses:
        '200':
          description: The image.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ge_session

  parameters:
    ConsoleSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
    ItemId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TrashEntryId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    GameId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UnassignedId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]{1,64}$'

  responses:
    Conflict:
      description: The resource is in a state that does not allow this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid or expired session, or wrong password.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many login attempts from this client; retry later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Invalid parameters.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: IGDB failed or could not be reached.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: The operation failed; `detail` explains what happened.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: IGDB credentials are not configured.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheck'

    HealthCheck:
      type: object
      required: [name, ok]
      properties:
        name:
          type: string
          example: library-writable
        ok:
          type: boolean
        message:
          type: string
          description: Human readable explanation when the check fails.

    LoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          format: password

    Session:
      type: object
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time

    ItemKind:
      type: string
      description: |
        What a file is within its game: base, update and dlc for consoles with
        add-ons (Switch); game for consoles with one file per game (Wii, PSP).
      enum: [base, update, dlc, game]

    Console:
      type: object
      required:
        [
          slug,
          displayName,
          defaultName,
          igdbPlatformId,
          extensions,
          customExtensions,
          kinds,
          multipleFiles,
          sortOrder,
          gameCount,
        ]
      properties:
        slug:
          type: string
          description: Folder name in the library; fixed.
          example: switch
        displayName:
          type: string
          example: Nintendo Switch
        defaultName:
          type: string
          description: The name defined in code (shown when the display name is reset).
        igdbPlatformId:
          type: integer
          format: int64
        releaseYear:
          type: integer
          nullable: true
          example: 2017
        logoImageId:
          type: string
          nullable: true
          description: IGDB image id; render with /api/images/logo_med/{logoImageId}.
        extensions:
          type: array
          description: Fixed extensions (environment variable or code default); cannot be removed here.
          items:
            type: string
            example: .nsp
        customExtensions:
          type: array
          description: Extensions added from the app.
          items:
            $ref: '#/components/schemas/CustomExtension'
        kinds:
          type: array
          description: The kinds a file of this console can have.
          items:
            $ref: '#/components/schemas/ItemKind'
        multipleFiles:
          type: boolean
          description: Whether one upload may hold several game files (Switch) or exactly one (Wii, PSP).
        sortOrder:
          type: integer
        gameCount:
          type: integer
          description: Games with at least one file in the library.

    CustomExtension:
      type: object
      required: [extension, fileCount]
      properties:
        extension:
          type: string
          example: .xcz
        fileCount:
          type: integer
          description: Files in the library with this extension; it can be removed only at 0.

    ConsoleUpdate:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 60

    ConsoleOrder:
      type: object
      required: [slugs]
      properties:
        slugs:
          type: array
          description: Every console slug, first to last.
          items:
            type: string

    ExtensionInput:
      type: object
      required: [extension]
      properties:
        extension:
          type: string
          example: .xcz

    MetadataGame:
      type: object
      required: [id, name, genres, platformIds]
      properties:
        id:
          type: integer
          format: int64
          description: IGDB game id.
        name:
          type: string
          example: Mario Kart 8 Deluxe
        releaseYear:
          type: integer
          nullable: true
        coverImageId:
          type: string
          nullable: true
          description: Render with /api/images/cover_big/{coverImageId}.
        summary:
          type: string
          nullable: true
        genres:
          type: array
          items:
            type: string
        platformIds:
          type: array
          items:
            type: integer
            format: int64

    MetadataStatus:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean

    ImageSize:
      type: string
      description: IGDB image size preset.
      enum: [cover_small, cover_big, logo_med, screenshot_med]

    JobStatus:
      type: string
      description: |
        uploading → uploaded → (extracting ⇄ needs_password) → confirm | invalid
        → committing → done. Parts of a multi-volume archive wait in
        waiting_parts; when the group is complete the first volume continues
        and the rest become merged. An invalid job can change console (back to
        confirm or invalid) or be set aside: unassigned, trashed or cancelled.
        done, failed, cancelled, merged, unassigned and trashed are terminal.
      enum:
        [
          uploading,
          uploaded,
          waiting_parts,
          merged,
          extracting,
          needs_password,
          confirm,
          invalid,
          committing,
          done,
          unassigned,
          trashed,
          failed,
          cancelled,
        ]

    InvalidReason:
      type: string
      description: none = no file fits the console; many = more than one, on a console with one file per game.
      enum: [none, many]

    UploadJob:
      type: object
      required: [id, fileName, size, received, status, console, title, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Equals the tus upload id.
        fileName:
          type: string
          example: Limbo_Switch.rar
        size:
          type: integer
          format: int64
        received:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/JobStatus'
        console:
          type: string
          description: Console slug chosen in the form.
        title:
          type: string
          description: Game name chosen in the form.
        igdbId:
          type: integer
          format: int64
          nullable: true
          description: IGDB game the name was picked from.
        invalidReason:
          allOf:
            - $ref: '#/components/schemas/InvalidReason'
          nullable: true
        fromUnassigned:
          type: boolean
          description: The job was started from an unassigned file.
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Extraction percentage while status is extracting.
        error:
          type: string
          nullable: true
          description: Human readable reason (failed, or why a password is needed).
        warning:
          type: string
          nullable: true
          description: Non-fatal note, e.g. archive file attributes not applied.
        groupSize:
          type: integer
          nullable: true
          description: Parts of the multi-volume archive this job belongs to.
        mergedInto:
          type: string
          nullable: true
          description: Job (first volume) that took over this part.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          format: password

    ConsoleChange:
      type: object
      required: [console]
      properties:
        console:
          type: string

    ResolveRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [unassigned, trash, delete]

    StagedFile:
      type: object
      required: [path, size, valid, consoles]
      properties:
        path:
          type: string
          description: Relative to the upload. Identifies the file in the commit.
          example: Limbo [0100A8E005E7C000].nsp
        size:
          type: integer
          format: int64
        valid:
          type: boolean
          description: A game file for the job's console; the others are discarded.
        consoles:
          type: array
          description: Every console whose extensions accept the file.
          items:
            type: string

    CommitRequest:
      type: object
      required: [files]
      properties:
        files:
          type: array
          description: One entry per valid file.
          items:
            $ref: '#/components/schemas/CommitFile'

    CommitFile:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: StagedFile.path.
        kind:
          allOf:
            - $ref: '#/components/schemas/ItemKind'
          description: Required on consoles with several kinds; omitted means game.
        label:
          type: string
          description: Update version (digits and dots) or DLC name.
        onDuplicate:
          $ref: '#/components/schemas/DuplicateAction'

    DuplicateAction:
      type: string
      enum: [replace, skip]
      description: replace sends the existing file to the trash; skip keeps it and drops the new one.

    PlannedFile:
      type: object
      required: [path, file, action]
      properties:
        path:
          type: string
        file:
          type: string
          description: Final name inside the game folder.
        action:
          $ref: '#/components/schemas/PlanAction'
        duplicate:
          allOf:
            - $ref: '#/components/schemas/LibraryItem'
          nullable: true

    PlanAction:
      type: string
      enum: [store, replace, skip, undecided]

    CommitPlan:
      type: object
      required: [console, title, folder, existing, files, discarded]
      properties:
        console:
          type: string
        title:
          type: string
        folder:
          type: string
          example: Limbo
        gameId:
          type: integer
          format: int64
          nullable: true
          description: Set when the game is already in the library.
        existing:
          type: array
          description: The game's current files.
          items:
            $ref: '#/components/schemas/LibraryItem'
        files:
          type: array
          items:
            $ref: '#/components/schemas/PlannedFile'
        discarded:
          type: array
          description: Files that are not game files for the console.
          items:
            type: string

    CommitResult:
      type: object
      required: [job, gameId, path, stored, replaced, skipped]
      properties:
        job:
          $ref: '#/components/schemas/UploadJob'
        gameId:
          type: integer
          format: int64
        path:
          type: string
          description: Library-relative game folder.
          example: switch/Limbo
        stored:
          type: integer
        replaced:
          type: integer
        skipped:
          type: integer

    LibraryItem:
      type: object
      required: [id, kind, file, size, createdAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/ItemKind'
        label:
          type: string
          nullable: true
          description: Update version (without the v) or DLC name.
        file:
          type: string
          description: Name inside the game folder.
        size:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    GameSummary:
      type: object
      required: [id, console, title, folder, itemCount, size]
      properties:
        id:
          type: integer
          format: int64
        igdbId:
          type: integer
          format: int64
          nullable: true
          description: Unset for games with a name of the user's own.
        console:
          type: string
          description: Console slug.
        title:
          type: string
        folder:
          type: string
          description: Folder inside the console folder.
        releaseYear:
          type: integer
          nullable: true
        coverImageId:
          type: string
          nullable: true
          description: Render with /api/images/cover_big/{coverImageId}.
        itemCount:
          type: integer
        size:
          type: integer
          format: int64
          description: Bytes of every file in the library.

    GameDetail:
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required: [path, genres, items]
          properties:
            path:
              type: string
              description: Library-relative folder.
              example: switch/Limbo
            summary:
              type: string
              nullable: true
            genres:
              type: array
              items:
                type: string
            items:
              type: array
              description: Files in the library (not in the trash), base first.
              items:
                $ref: '#/components/schemas/LibraryItem'

    GameEdit:
      type: object
      required: [console, title]
      properties:
        console:
          type: string
          description: Target console (the current one to only rename).
        title:
          type: string
          minLength: 1
          maxLength: 200
        igdbId:
          type: integer
          format: int64
          nullable: true
          description: IGDB game the title was picked from; unset for a name of the user's own.
        decisions:
          type: array
          description: For collisions when merging into another game.
          items:
            $ref: '#/components/schemas/ItemDecision'

    ItemDecision:
      type: object
      required: [itemId, onDuplicate]
      properties:
        itemId:
          type: integer
          format: int64
        onDuplicate:
          $ref: '#/components/schemas/DuplicateAction'

    GameEditPlan:
      type: object
      required: [console, title, folder, items]
      properties:
        console:
          type: string
        title:
          type: string
        folder:
          type: string
          description: Folder after the change.
        mergeInto:
          type: integer
          format: int64
          nullable: true
          description: Game that already has the name on that console; the games merge.
        items:
          type: array
          items:
            $ref: '#/components/schemas/GameEditItem'

    GameEditItem:
      type: object
      required: [item, file, action]
      properties:
        item:
          $ref: '#/components/schemas/LibraryItem'
        file:
          type: string
          description: New name.
        action:
          $ref: '#/components/schemas/PlanAction'
        duplicate:
          allOf:
            - $ref: '#/components/schemas/LibraryItem'
          nullable: true

    GameEditResult:
      type: object
      required: [gameId, path, merged]
      properties:
        gameId:
          type: integer
          format: int64
        path:
          type: string
          example: switch/Limbo
        merged:
          type: boolean

    ItemEdit:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/ItemKind'
        label:
          type: string
        onDuplicate:
          $ref: '#/components/schemas/DuplicateAction'

    UnassignedFile:
      type: object
      required: [id, path, name, origin, reason, size, arrivedAt, consoles, archive]
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
          description: Relative to the unassigned folder.
          example: wii/Zelda/Zelda.iso
        name:
          type: string
        origin:
          type: string
          description: Where it came from (a library path, or the upload's file name).
        reason:
          type: string
          enum: [samba, upload, manual]
          description: Added over SMB, an upload that did not fit, or moved here by the user.
        size:
          type: integer
          format: int64
        arrivedAt:
          type: string
          format: date-time
        consoles:
          type: array
          description: Consoles whose extensions accept the file.
          items:
            type: string
        archive:
          type: boolean
          description: A zip, 7z or rar; it is validated once extracted.

    AssignRequest:
      type: object
      required: [console, title]
      properties:
        console:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        igdbId:
          type: integer
          format: int64
          nullable: true

    ScanReport:
      type: object
      required: [scannedAt, unassigned, removed, pending]
      properties:
        scannedAt:
          type: string
          format: date-time
        unassigned:
          type: integer
          description: Unknown files moved to (or found in) the unassigned section.
        removed:
          type: integer
          description: Files deleted over SMB that left the library.
        pending:
          type: integer
          description: Unknown files that are still changing (a copy in progress); the next scan moves them.

    ScanStatus:
      type: object
      properties:
        lastScan:
          allOf:
            - $ref: '#/components/schemas/ScanReport'
          nullable: true
          description: Unset until the first scan has run.

    TrashEntry:
      type: object
      required: [id, kind, title, wholeGame, reason, trashedAt, expiresAt, size, items, files]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [game, unassigned]
          description: Files of a game, or unassigned files.
        gameId:
          type: integer
          format: int64
          nullable: true
        console:
          type: string
          nullable: true
        title:
          type: string
          description: The game's title; empty for unassigned files.
        folder:
          type: string
          nullable: true
        wholeGame:
          type: boolean
        reason:
          type: string
          enum: [deleted, replaced]
          description: deleted by the user, or replaced by a duplicate.
        trashedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When it is deleted for good (TRASH_RETENTION_DAYS).
        size:
          type: integer
          format: int64
        items:
          type: array
          description: Game files (kind game).
          items:
            $ref: '#/components/schemas/LibraryItem'
        files:
          type: array
          description: Unassigned files (kind unassigned).
          items:
            $ref: '#/components/schemas/UnassignedFile'

    RestoreRequest:
      type: object
      properties:
        onConflict:
          type: string
          enum: [replace]

    RestoreResult:
      type: object
      required: [path]
      properties:
        gameId:
          type: integer
          format: int64
          nullable: true
        path:
          type: string
          description: Library-relative folder the entry went back to.

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
