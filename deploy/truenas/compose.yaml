# GameExplorer as a TrueNAS SCALE custom app (Apps › Discover Apps ›
# Custom App › Install via YAML). Replace the values marked CHANGE.
services:
  gameexplorer:
    image: ghcr.io/carlossv923/gameexplorer:latest
    restart: unless-stopped
    # The user that owns what the app writes. Give it a Modify ACL entry on
    # the library dataset (a container does not inherit supplementary groups).
    user: '3000:3000'
    ports:
      - '8080:8080'
    environment:
      LIBRARY_PATH: /library
      DATA_PATH: /data
      APP_PASSWORD: 'CHANGE-me' # or APP_PASSWORD_HASH (argon2id)
      SESSION_SECRET: 'CHANGE-32-or-more-random-characters'
      COOKIE_SECURE: 'false' # true only behind HTTPS
      IGDB_CLIENT_ID: '' # optional
      IGDB_CLIENT_SECRET: '' # optional
      LIBRARY_SCAN_INTERVAL: 15m
      TRASH_RETENTION_DAYS: '30'
      # SWITCH_EXTENSIONS: .nsp,.xci
      # WII_EXTENSIONS: .iso,.wbfs,.rvz,.nkit.iso
      # PSP_EXTENSIONS: .iso,.cso
      # PS2_EXTENSIONS: .iso
      # GC_EXTENSIONS: .iso,.rvz
      # N64_EXTENSIONS: .z64,.n64,.v64
    volumes:
      - /mnt/CHANGE-pool/games:/library # the SMB dataset
      - /mnt/CHANGE-pool/apps/gameexplorer:/data # SQLite + image cache
