# TrueNAS SCALE → Apps → Discover Apps → ⋮ → "Install via YAML"
# Replace the three values marked CHANGE before installing.
services:
  spike:
    image: ghcr.io/carlossv923/gameexplorer-spike:latest
    # Always fetch the newest spike build when the app (re)starts.
    pull_policy: always
    # CHANGE: UID:GID of the test dataset owner (Credentials → Users shows the UID).
    user: "3000:3000"
    environment:
      LIBRARY_PATH: /library
      UMASK: "002"
    ports:
      # CHANGE (only if 8090 is already used on the NAS): left side is the NAS port.
      - "8090:8090"
    volumes:
      # CHANGE: full path of the test dataset (Datasets → select it → "Path").
      - /mnt/POOL/DATASET:/library
    restart: unless-stopped
